<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>线路预览与规划</title>
  <!-- CONFIG -->
  <script>document.documentElement.dataset.theme=(window.ROUTE_CONFIG?.darkTheme??matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';</script>
  <style>
    :root{color-scheme:light;--surface:#f7f7f7;--card:#fff;--text:#191919;--muted:#757575;--control:#f1f2f5;--accent:#3482ff;--accent-soft:#edf4ff;--line:#eceef2;--shadow:0 6px 28px #182d4a12}
    :root[data-theme=dark]{color-scheme:dark;--surface:#0e1116;--card:#202329;--text:#f2f4f8;--muted:#a4aab5;--control:#30343b;--accent:#6ea4ff;--accent-soft:#293950;--line:#383d46;--shadow:0 6px 28px #0003}
    *{box-sizing:border-box}html,body,#map{width:100%;height:100%;margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text)}
    body{background:var(--surface)}#map{position:fixed;inset:0;width:auto;height:auto;touch-action:none}[hidden]{display:none!important}
    button,input{font:inherit;touch-action:manipulation}button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 12px;border:0;border-radius:14px;background:var(--control);color:var(--text);font-size:13px;font-weight:550;cursor:pointer;transition:background .16s,transform .16s}
    button:disabled{opacity:.38;cursor:default}button:active:not(:disabled){transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    button.primary{background:var(--accent);color:white}button.selected{color:var(--accent);background:var(--accent-soft)}
    .tool-icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .panel{position:fixed;z-index:100;left:16px;right:16px;background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
    body.native-ui .panel{display:none!important}body.native-ui #fit{display:none!important}
    body.native-ui .amap-logo,body.native-ui .amap-copyright{bottom:calc(var(--native-bottom,0px) + 8px)!important}
    body.native-ui .amap-scalecontrol{bottom:calc(var(--native-bottom,0px) + 40px)!important}
    .top{top:12px;padding:16px 18px;max-height:25%;overflow:auto;overscroll-behavior:contain}
    .top{display:none!important}
    #editorHeading,#toolsHeading{display:none!important}
    .heading{display:flex;align-items:center;gap:12px}.campus-icon{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:14px;background:var(--accent-soft);color:var(--accent);flex:none}.campus-icon .tool-icon{width:23px;height:23px}
    .campus-title{flex:1;min-width:0}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:3px}#school{font-size:15px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
    #detailsToggle{background:transparent;min-height:40px;padding:8px 4px;font-size:12px;color:var(--muted);flex:none}
    #checkInRequirements{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}#viaCheckIns{width:100%;margin-top:10px;background:var(--accent-soft);color:var(--accent)}
    #details .hint{margin-top:8px}#legend{padding-top:8px;border-top:1px solid var(--line)}
.map-actions{position:fixed;z-index:100;right:18px;top:154px;display:flex;flex-direction:column;gap:8px}.map-actions button{min-width:48px}
    .bottom{bottom:12px;max-height:52%;padding:9px 18px 16px;display:flex;flex-direction:column;overflow:hidden}
    .sheet-content{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.sheet-grip,.footer-row{flex-shrink:0}
    .sheet-grip{width:30px;height:4px;margin:0 auto 12px;border-radius:8px;background:var(--line)}
    .editor-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.editor-title{font-size:17px;font-weight:650}
    .editing-switch{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-height:30px}.editing-switch input{width:16px;height:16px;margin:0;accent-color:var(--accent)}
    .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mode-row{padding:4px;background:var(--control);border-radius:18px;gap:4px;flex-wrap:nowrap}
    .mode{flex:1;flex-direction:column;gap:5px;min-height:60px;padding:8px 3px;background:transparent;border-radius:14px;font-size:11px;white-space:nowrap;font-weight:500;color:var(--muted)}.mode .tool-icon{width:21px;height:21px}
    .mode.selected{background:var(--card);color:var(--accent);box-shadow:0 2px 8px #172b4310;font-weight:650}
    .route-state{display:flex;align-items:flex-start;gap:8px;margin:12px 0 8px}.route-dot{width:7px;height:7px;margin-top:6px;flex:none;border-radius:50%;background:var(--accent)}#summary{font-size:13px;line-height:1.45;font-weight:600}
    #status{font-size:11px;line-height:1.5;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}#status.error{color:#df5a53}
    .edit-row{gap:4px;padding:7px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.edit-row button{flex:1;min-width:0;min-height:40px;padding:8px 6px;background:transparent;font-size:11px}.edit-row .tool-icon{width:16px;height:16px}.edit-row button.selected{background:var(--accent-soft)}
    label{display:flex;align-items:center;gap:6px;font-size:12px;min-height:40px}input[type=checkbox],input[type=range]{accent-color:var(--accent)}.edit-row label{padding:0 5px;color:var(--muted)}
    .tools-heading{display:flex;align-items:center;gap:10px;margin-top:8px}#note{font-size:11px;line-height:1.5;color:var(--muted);flex:1;margin:0}
    .advanced{padding:12px;margin-top:10px;background:var(--control);border-radius:16px}.advanced-title{font-size:11px;color:var(--muted);margin-bottom:5px}.advanced .row+.row{margin-top:8px}.advanced button{background:var(--card);min-height:40px;font-size:11px;padding:8px 10px}.advanced button.selected{background:var(--accent-soft)}
    #routeOptions,#startTools{gap:6px}#jitter{width:90px}#jitterValue{white-space:nowrap;font-size:11px}#startTools label{flex:1;justify-content:space-between;min-width:180px}
    .footer-row{margin-top:8px;padding:8px 0 0;flex-wrap:nowrap;background:var(--card)}#save{flex:1;min-height:48px;font-size:14px;font-weight:600;border-radius:16px}#retry{display:none}
    .hint{font-size:11px;line-height:1.55;color:var(--muted)}#liveStats{font-size:17px;font-weight:650;line-height:1.6}
    #drawSurface{position:fixed;inset:0;z-index:80;pointer-events:none}
    #map.drawing{cursor:crosshair}
    .number{background:#3482ff;color:white;border:2px solid white;border-radius:50%;width:27px;height:27px;text-align:center;line-height:23px;font-weight:600;box-shadow:0 1px 6px #0003}.number.start{background:#157a69}.number.linked{transform:translate(24px,16px)}.number.end{background:#22a35a}
.liveHead{width:16px;height:16px;border-radius:50%;background:#3482ff;border:3px solid white;box-shadow:0 0 0 5px #3482ff25}.locationHead{width:18px;height:18px;border-radius:50%;background:#3482ff;border:3px solid white;box-shadow:0 0 0 6px #3482ff35}
    body.picking-start .mode-row,body.picking-start .edit-row,body.picking-start .advanced{display:none!important}
    @media(max-width:360px){.panel{left:10px;right:10px}.top{padding:12px 14px}.bottom{padding:8px 12px 12px}.mode{min-height:54px;font-size:10px}.edit-row{gap:2px}.edit-row button{padding:7px 3px;font-size:10px}.edit-row .tool-icon{width:14px;height:14px}.map-actions{right:12px}}
    @media(max-height:650px){.top{top:8px}.bottom{bottom:8px;max-height:46%}.sheet-grip{margin-bottom:8px}.editor-heading{margin-bottom:8px}.mode{min-height:50px;gap:3px}.route-state{margin:8px 0}.tools-heading{margin-top:5px}.footer-row{margin-top:8px}#note{display:none}}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="drawSurface" hidden aria-label="手绘轨迹区域"></div>
  <div class="panel top">
    <div class="heading">
      <div class="campus-icon" aria-hidden="true"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <div class="campus-title"><div class="eyebrow">校园线路</div><div id="school">地图浏览</div></div>
      <button id="detailsToggle" aria-expanded="false" aria-controls="details">说明</button>
    </div>
    <div id="checkInRequirements">跑道模式：两弯道端点 + 一侧直道三点定形</div>
    <div id="details" hidden><div class="hint" id="checkInNote">登录并加载校园围栏后查看打卡要求</div><div class="hint" id="previewNote"></div><div class="hint" id="legend">蓝色实线为路线，浅蓝虚线为预览；紫色虚线为接入段，绿色为校园围栏。红色「打」为打卡点，紫色「碰」为碰一碰参考点。</div></div>
  </div>
  <div class="map-actions"><button id="location" aria-label="定位当前位置">定位</button><button id="satellite" aria-label="切换卫星图">卫星</button></div>
  <div class="panel bottom">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div class="sheet-content">
    <div class="editor-heading" id="editorHeading"><div class="editor-title">规划路线</div><input id="editing" type="checkbox" checked hidden><span id="editingLabel" hidden></span></div>
    <div id="liveStats" hidden></div>
    <div class="row mode-row" id="modesRow" hidden><button id="track" class="mode selected">跑道模式</button><button id="manual" class="mode">手动加点</button><button id="road" class="mode">吸附道路</button><button id="draw" class="mode">手绘轨迹</button></div>
    <button id="viaCheckIns" hidden>经本次打卡点规划步行线路</button>
    <div class="route-state"><span class="route-dot" aria-hidden="true"></span><div><div id="summary">0 个控制点 · 0 米</div><div id="status" role="status" aria-live="polite">正在加载高德地图…</div></div></div>
    <div class="row edit-row" id="editRow"><button id="undo">撤销</button><button id="clear">清空</button><button id="insert">插点</button><button id="simplify" hidden>精简</button><button id="fromPreview" hidden>取预览</button><label><input id="closed" type="checkbox">闭合</label></div>
    <div class="tools-heading" id="toolsHeading"><div id="note">跑道模式：依次选择两个弯道尖端和一侧直道点，拖动三个点对齐跑道。</div></div>
    <div class="advanced" id="advancedTools" hidden>
      <div class="advanced-title">线路复用与起跑设置</div>
      <div class="row" id="routeOptions"><label><input id="fixed" type="checkbox">固定复用</label><button id="saveFixed">保存固定线路</button><button id="loadFixed" hidden>载入固定线路</button><button id="reverseTrack" hidden>反向绕行</button></div>
      <div class="row" id="startTools"><button id="pickStart">设置起跑点</button><button id="resetStart" hidden>用线路起点</button></div>
      <input id="jitter" type="range" min="0" max="16" step="0.5" value="0" hidden><span id="jitterValue" hidden>0 米</span>
    </div>
    </div>
    <div class="row footer-row"><button id="cancelStart" hidden>取消选点</button><button id="retry">重新加载</button><button id="save" class="primary" disabled>使用线路</button></div>
  </div>
  <script>
  (function(){
    'use strict';
    const config=window.ROUTE_CONFIG||{}, $=id=>document.getElementById(id);
    document.body.classList.toggle('native-ui',config.nativeControls===true);
    let uiTimer=null,nativeInsets=[24,24,24,24];
    const nativeActions=['track','manual','road','draw','undo','clear','insert','simplify','closed','editing','fixed','saveFixed','loadFixed','reverseTrack','pickStart','resetStart','fromPreview','viaCheckIns','save','retry','cancelStart'];
    function uiState(){return {ready,pending,valid,mode,closed,fixed,startPicking,reverse:trackReverse,jitterMeters,
      school:$('school').textContent,requirements:$('checkInRequirements').textContent,summary:$('summary').textContent,
      status:$('status').textContent,error:!!lastError,note:$('note').textContent,
      details:[$('checkInNote').textContent,$('previewNote').textContent,$('legend').textContent].filter(Boolean).join('\n\n'),
      liveStats:$('liveStats').textContent,saveLabel:$('save').textContent,
      controls:Object.fromEntries(nativeActions.map(id=>{const el=$(id);return [id,{enabled:!el.disabled&&(id==='retry'||ready)&&(!viewer||['fit','retry'].includes(id)),
        visible:!el.hidden&&(id!=='retry'||el.style.display==='block'),checked:el.checked===true}];}))};}
    function publishUi(){if(!config.nativeControls||uiTimer!==null)return;
      uiTimer=setTimeout(()=>{uiTimer=null;if(window.RouteNative&&typeof RouteNative.updateUiState==='function')RouteNative.updateUiState(JSON.stringify(uiState()));},16);}
    // Local SVGs add recognizable actions without network fonts or icon-only controls.
    const toolIcons={
      track:'<rect x="4" y="3" width="16" height="18" rx="8"/><rect x="8" y="7" width="8" height="10" rx="4"/>',
      manual:'<path d="M12 4v16M4 12h16"/>',road:'<path d="m6 3-3 18m15-18 3 18M12 3v4m0 3v4m0 3v4"/>',
      draw:'<path d="m15 4 5 5-11 11H4v-5L15 4Zm-2 2 5 5"/>',
      undo:'<path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12"/>',clear:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/>',
      insert:'<path d="M4 4v16m16-16v16M8 12h8m-4-4v8"/>',simplify:'<path d="m3 18 5-12 8 10 5-13M3 18 21 3"/>',
      fit:'<path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/>',
      saveFixed:'<path d="M4 3h13l3 3v15H4V3Zm3 0v6h10V3M8 21v-7h8v7"/>',
      loadFixed:'<path d="M3 6h7l2 2h9l-2 12H3V6Z"/>',reverseTrack:'<path d="M4 7h16l-4-4M20 17H4l4 4"/>',
      pickStart:'<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
      resetStart:'<path d="M4 10a8 8 0 1 1 2 8M4 4v6h6"/>',retry:'<path d="M20 7a8 8 0 0 0-14-2L3 8m0-5v5h5m-4 9a8 8 0 0 0 14 2l3-3m0 5v-5h-5"/>',
      viaCheckIns:'<path d="M5 3v14a4 4 0 0 0 8 0V7a3 3 0 0 1 6 0v14"/><circle cx="5" cy="3" r="2"/>',
      fromPreview:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',save:'<path d="m5 12 4 4L19 6"/>',
    };
    function setToolText(id,text){const button=$(id);button.textContent=text;if(toolIcons[id])button.insertAdjacentHTML('afterbegin','<svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">'+toolIcons[id]+'</svg>');}
    Object.keys(toolIcons).forEach(id=>{if($(id))setToolText(id,$(id).textContent);});
    const lockedMode=['track','draw'].includes(config.lockedMode)?config.lockedMode:null;
    let map=null,walking=null,line=null,previewLine=null,fence=null,markers=[],checkInMarkers=[],accessLines=[],access=[],anchors=[],path=[],mode='track',closed=true;
    let revision=0,timer=null,pending=false,valid=false,ready=false,lastError=null;
    let currentLocation=null,pendingLocation=null,locationMarker=null,locationCircle=null,satelliteLayer=null,roadNetLayer=null,standardLayers=[];
    const normalLocation=config.currentLocation;
    function validLocation(value){return value&&Number.isFinite(Number(value.latitude))&&Number(value.latitude)>=-90&&Number(value.latitude)<=90&&Number.isFinite(Number(value.longitude))&&Number(value.longitude)>=-180&&Number(value.longitude)<=180&&Number.isFinite(Number(value.accuracy))&&Number(value.accuracy)>=0;}
    function convertGps(value){return new Promise((resolve,reject)=>{if(!validLocation(value)){reject(Error('当前位置无效，请检查定位权限后重试'));return;}let settled=false;const finish=(error,result)=>{if(settled)return;settled=true;clearTimeout(timeout);if(error){reject(error);return;}const p=result.locations[0];resolve({point:[p.getLng(),p.getLat()],accuracy:Number(value.accuracy)});};const timeout=setTimeout(()=>finish(Error('当前位置坐标转换超时，请重试')),15000);try{AMap.convertFrom([Number(value.longitude),Number(value.latitude)],'gps',(status,result)=>{if(status!=='complete'||!result||!result.locations||!result.locations.length){finish(Error('当前位置坐标转换失败，请重试'));return;}finish(null,result);});}catch(error){finish(error);}});}
    function updateLocationMarker(location,center=true){if(!map)return;const point=location.point;
      if(locationMarker)locationMarker.setPosition(point);else locationMarker=new AMap.Marker({position:point,anchor:'center',bubble:false,zIndex:180,content:'<div class="locationHead"></div>',map});
      if(locationCircle)locationCircle.setCenter(point),locationCircle.setRadius(location.accuracy);else locationCircle=new AMap.Circle({center:point,radius:location.accuracy,strokeColor:'#3482ff',strokeWeight:1,fillColor:'#3482ff',fillOpacity:.12,bubble:false,zIndex:70,map});
      if(center)map.setZoomAndCenter(18.5,point,true);currentLocation=location;
    }
    async function applyLocation(value,center=true){pendingLocation=value;try{const location=await convertGps(value);if(pendingLocation!==value)return;pendingLocation=null;if(!map){pendingLocation=value;return;}updateLocationMarker(location,center);status('当前位置已定位');}catch(error){if(pendingLocation===value){pendingLocation=null;status(error.message||'当前位置坐标转换失败，请重试',true);$('retry').style.display='block';}}}
    function configureBasemap(){
      standardLayers=map.getLayers().slice();
      satelliteLayer=new AMap.TileLayer.Satellite({zIndex:1});
      roadNetLayer=new AMap.TileLayer.RoadNet({zIndex:2});
      let satelliteEnabled=false;
      $('satellite').textContent='标准';
      $('satellite').classList.remove('selected');
      $('satellite').onclick=()=>{
        satelliteEnabled=!satelliteEnabled;
        map.setLayers(satelliteEnabled?[satelliteLayer,roadNetLayer]:standardLayers);
        if(!satelliteEnabled)map.setMapStyle('amap://styles/normal');
        $('satellite').textContent=satelliteEnabled?'卫星':'标准';
        $('satellite').classList.toggle('selected',satelliteEnabled);
        // Route overlays are independent of the tile layers and remain legible on either basemap.
        if(line)line.setMap(map);
        renderLine();
      };
    }
    $('checkInRequirements').textContent=config.checkInRequirements||'跑道模式：两弯道端点 + 一侧直道三点定形';
    let drawn=[],stroke=null,history=[],tapGesture=null,controlTap=null,lastPointerUp=-Infinity,lastNavigation=-Infinity;
    let fixed=false,fixedPath=[],selectedStart=null,startPicking=false,inserting=false,jitterMeters=0,startMarker=null;
    let trackReverse=false;
    const MAX_DRAWING_POINTS=256;
    let drawingSimplification=null;
    const pointers=new Map(),roadCache=new Map();
    let multiTouch=false,navigation=null,navigationFrame=0,navigationEndTimer=0;
    const boundary=config.boundary||[],preview=config.preview||[];
    const activeRun=config.requireCheckIns===true,sessionStart=Array.isArray(config.sessionStart)?config.sessionStart:null;
    const targets=config.targetPoints||[];
    const checkInPolicy=config.checkInPolicy||{validDistance:12,clockMode:0};
    const checkInRadius=Number(checkInPolicy.validDistance);
    const DRAW_CLOSE_METERS=12;
    const draft=config.draft||{mode:lockedMode||'track',closed:lockedMode==='track'};
    let trackDefaultStart=!draft.startPoint;
    mode=lockedMode||(['road','draw','track','manual'].includes(draft.mode)?draft.mode:'track');
    anchors=(draft.anchors||[]).map(p=>p.slice());if(mode!=='track')anchors=pinStart(anchors);closed=mode==='track'||draft.closed===true;trackReverse=draft.reverse===true;
    if(mode==='draw')loadDrawing(draft.path||[]);
    fixed=draft.fixed===true;fixedPath=(draft.path||[]).map(p=>p.slice());selectedStart=activeRun?sessionStart:(draft.startPoint||null);
    jitterMeters=draft.jitterMeters==null?0:Number(draft.jitterMeters);$('fixed').checked=fixed;$('jitter').value=jitterMeters;
    if(fixed)$('editing').checked=false;
    $('pickStart').hidden=activeRun;$('resetStart').hidden=activeRun||!selectedStart;
    $('loadFixed').hidden=!config.fixedDraft;
    $('closed').checked=closed;
    $('fromPreview').hidden=preview.length<2||activeRun;
    $('viaCheckIns').hidden=!activeRun;
    $('school').textContent=config.fenceName||'线路规划';
    $('checkInRequirements').textContent=config.checkInRequirements||'手动加点、手绘轨迹、操场绕圈或吸附步行道路';
    $('checkInNote').textContent=config.checkInNote||'线路保存在本机，不需要登录或 Token。';
    $('previewNote').textContent=config.previewNote||'';
    // Read-only viewer: live run tracking or finished-run replay. Editing stays disabled.
    const viewer=config.viewer==='live'||config.viewer==='finished'?config.viewer:null;
    let liveTrack=(config.liveTrack||[]).filter(p=>Array.isArray(p)&&p.length>=2&&p.every(Number.isFinite));
    let liveStartMs=Number(config.liveStartMs)||0;
    let liveTargets=(config.liveTargetPoints||[]).map(p=>({code:String(p.code??''),clockTime:Number(p.clockTime)||0}));
    let liveBase={seconds:Number(config.liveElapsed)||0,at:performance.now(),running:config.liveRunning===true,ending:false};

      config.nativeControls?nativeInsets:[document.querySelector('.top').offsetHeight+28,document.querySelector('.bottom').offsetHeight+32,32,32]);}
    $('location').hidden=viewer;
    $('location').onclick=()=>{if(window.RouteNative&&typeof RouteNative.requestCurrentLocation==='function')RouteNative.requestCurrentLocation();else if(normalLocation)applyLocation(normalLocation,true);};
    $('retry').onclick=()=>location.reload();
    $('save').onclick=()=>{
      if(pending||(activeRun?!valid:(!valid&&anchors.length))||!ready)return;
      const value=result();
      if(window.RouteNative)window.RouteNative.saveRoute(JSON.stringify(value));
      else {window.savedRoute=value;status('线路已保存（浏览器预览）');}
    };
    window.RouteEditor={addPoint:addPoint,showError:message=>status(message,true),
      fixedSaved,
      getUiState:uiState,
      performAction:id=>{if(!nativeActions.includes(id))return;const action=uiState().controls[id];if(action.enabled&&action.visible)$(id).click();},
      setCurrentLocation:value=>{if(!validLocation(value)){status('当前位置无效，请检查定位权限后重试',true);return;}pendingLocation=value;if(window.AMap&&map)applyLocation(value,true);},
      setJitter:value=>{if(viewer||!ready||!Number.isFinite(value))return;$('jitter').value=Math.max(0,Math.min(16,Math.round(value*2)/2));$('jitter').dispatchEvent(new Event('input'));},
      setUiInsets:(top,bottom)=>{if(!Number.isFinite(top)||!Number.isFinite(bottom))return;nativeInsets=[Math.max(24,top+24),Math.max(24,bottom+24),24,24];document.body.style.setProperty('--native-bottom',Math.max(0,bottom)+'px');if(ready)fitMap();},
      setLive:value=>{if(!viewer)return;liveBase={seconds:Number(value&&value.seconds)||liveBase.seconds,at:performance.now(),
          running:value&&value.running===true,ending:value&&value.ending===true};renderLive();},
      setLiveTrack:(points,startMs,targets)=>{if(!viewer||!Array.isArray(points))return;
        liveTrack=points.filter(p=>Array.isArray(p)&&p.length>=2&&p.every(Number.isFinite));
        liveStartMs=Number(startMs)||0;
        liveTargets=(targets||[]).map(p=>({code:String(p.code??''),clockTime:Number(p.clockTime)||0}));
        renderLive();},
      getState:()=>({ready,pending,valid,anchors,path,mode,closed,fixed,startPoint:selectedStart,jitterMeters,reverse:trackReverse,drawingSimplification,access,error:lastError,meters:length(path)}),
      setDraft:value=>{mode=lockedMode||(['road','draw','track'].includes(value.mode)?value.mode:'manual');anchors=(value.anchors||[]).map(p=>p.slice());if(mode!=='track')anchors=pinStart(anchors);closed=mode==='track'||value.closed===true;trackReverse=value.reverse===true;
        if(mode==='draw')loadDrawing(value.path||[]);fixed=value.fixed===true;fixedPath=(value.path||[]).map(p=>p.slice());
        selectedStart=activeRun?sessionStart:(value.startPoint||null);trackDefaultStart=!value.startPoint;jitterMeters=value.jitterMeters==null?0:Number(value.jitterMeters);
        $('fixed').checked=fixed;$('editing').checked=!fixed;$('jitter').value=jitterMeters;$('closed').checked=closed;startPicking=false;changed();}};
    if(viewer)hideViewerUi();
    controls();
    const nativeMapReady=()=>{if(window.RouteNative&&typeof RouteNative.mapReady==='function')RouteNative.mapReady();};
    const nativeMapFailed=message=>{if(window.RouteNative&&typeof RouteNative.mapFailed==='function')RouteNative.mapFailed(String(message||'高德地图加载失败'));};
    if(!config.key||!config.securityCode){const message='高德地图尚未配置，请在地图设置中填写 Web 端 Key 和安全密钥';status(message,true);nativeMapFailed(message);return;}
    window._AMapSecurityConfig={securityJsCode:config.securityCode};
    const loader=document.createElement('script');loader.src='https://webapi.amap.com/loader.js';
    let loadTimer=setTimeout(()=>{const message='高德地图加载超时，请检查网络并重新加载';status(message,true);nativeMapFailed(message);$('retry').style.display='block';},30000);
    loader.onerror=()=>{const message='高德地图加载失败，请检查网络';clearTimeout(loadTimer);status(message,true);nativeMapFailed(message);$('retry').style.display='block';};
    loader.onload=()=>{AMapLoader.load({key:config.key,version:'2.0',plugins:['AMap.Scale']}).then(async()=>{
      clearTimeout(loadTimer);
      let initialCenter,initialLocation=null;
      if(viewer){
        const historical=(liveTrack.length?liveTrack[0]:preview[0]);
        if(!historical||historical.length<2){status('没有可显示的历史轨迹或预览线路',true);$('retry').style.display='block';return;}
        initialCenter=[Number(historical[0]),Number(historical[1])];
      }else{
        if(!validLocation(normalLocation)){status('未获取当前位置，请授予定位权限后重试',true);$('retry').style.display='block';return;}
        try{initialLocation=await convertGps(normalLocation);initialCenter=initialLocation.point;}
        catch(error){status(error.message||'当前位置坐标转换失败，请重试',true);$('retry').style.display='block';return;}
      }
      map=new AMap.Map('map',{zoom:viewer?16:18.5,center:initialCenter,zooms:[3,20],viewMode:'2D',rotateEnable:false,pitchEnable:false,
        resizeEnable:true,mapStyle:'amap://styles/normal',features:['bg','road','point','building'],showLabel:true});
      map.addControl(new AMap.Scale());configureBasemap();
      if(initialLocation)updateLocationMarker(initialLocation,false);
      if(boundary.length>=3)fence=new AMap.Polygon({path:boundary,strokeColor:'#18865b',strokeWeight:2,fillColor:'#3dc68b',fillOpacity:.08,bubble:true,map:map});
      if(preview.length>=2)previewLine=new AMap.Polyline({path:preview,strokeColor:'#73b5d9',strokeWeight:3,strokeStyle:'dashed',bubble:true,map:map});
      renderCheckIns(config.targetPoints||[],false);renderCheckIns(config.tapPoints||[],true);
      map.on('click',e=>{if(!multiTouch&&(startPicking||(mode!=='draw'&&$('editing').checked))&&performance.now()-lastPointerUp>=700)addPoint([e.lnglat.getLng(),e.lnglat.getLat()]);});
      ready=true;
      if(viewer)initViewer();else changed();
      if(viewer&&(fence||previewLine||checkInMarkers.length||livePlanned||liveTrack.length))fitMap();
      if(activeRun&&config.autoPlan===true&&!fixed&&mode!=='track'&&anchors.length<2)planViaCheckIns();
      $('retry').style.display='none';publishUi();nativeMapReady();
      if(pendingLocation&&pendingLocation!==normalLocation)applyLocation(pendingLocation,true);
    }).catch(e=>{const message='高德地图初始化失败：'+(e.message||String(e));clearTimeout(loadTimer);status(message,true);nativeMapFailed(message);$('retry').style.display='block';});};
    document.head.appendChild(loader);
  })();
  </script>
</body>
</html>
